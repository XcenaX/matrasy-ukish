# Временный конфиг для получения первого сертификата.
# Используется ОДИН РАЗ при первом деплое — после успешного certbot
# подменяется на conf.d/api.conf. Подробнее в DEPLOY.md.

server {
    listen 80;
    server_name api.matras-ukish.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
