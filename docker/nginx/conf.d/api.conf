limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_admin:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=api_addr:10m;
limit_req_status 429;
limit_conn_status 429;

# HTTP — редирект на HTTPS + обработка ACME-challenge для certbot
server {
    listen 80;
    server_name api.matras-ukish.kz;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=api_general burst=20 nodelay;
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    http2 on;
    server_name api.matras-ukish.kz;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/api.matras-ukish.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.matras-ukish.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1024M;
    limit_conn api_addr 30;

    location /admin {
        limit_req zone=api_admin burst=30 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        client_body_timeout 600;
        proxy_request_buffering off;
    }

    location / {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        client_body_timeout 600;
        proxy_request_buffering off;
    }
}
