# HTTP — редирект на HTTPS + обработка ACME-challenge для certbot
server {
    listen 80;
    server_name api.matras-ukish.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    http2 on;
    server_name api.matras-ukish.kz;

    ssl_certificate /etc/letsencrypt/live/api.matras-ukish.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.matras-ukish.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }
}
