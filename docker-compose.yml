name: ukish

services:
  postgres:
    image: postgres:16-alpine
    container_name: ukish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ukish
      POSTGRES_USER: ukish
      POSTGRES_PASSWORD: ukish_password
    ports:
      - "5437:5432"
    volumes:
      - ukish_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukish -d ukish"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build:
      context: ./cms
    container_name: ukish-strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS:-localKey1,localKey2,localKey3,localKey4}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-localApiTokenSalt}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-localAdminJwtSecret}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-localTransferTokenSalt}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:-localEncryptionKey32CharsLong}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ukish_strapi
      DATABASE_USERNAME: ukish
      DATABASE_PASSWORD: ukish_password
      DATABASE_SSL: "false"
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/app/public/uploads

  website:
    build:
      context: .
    container_name: ukish-website
    restart: unless-stopped
    depends_on:
      - strapi
    environment:
      # Server-side: использует Docker-сеть
      STRAPI_URL: http://strapi:1337
      # Client-side (браузер): использует внешний порт
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  ukish_postgres_data:
  strapi_uploads:
